<svg viewBox="0 0 300 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract illustration of a path tracing up and across, framing a glowing radial hub at the center">
  <defs>
    <linearGradient id="tl-grad" x1="60" y1="360" x2="240" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a855f7" />
      <stop offset="1" stop-color="#e879f9" />
    </linearGradient>
    <radialGradient id="tl-radial-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tl-radial-fuchsia" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879f9" stop-opacity="0.9" />
      <stop offset="1" stop-color="#e879f9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tl-radial-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5d0fe" />
      <stop offset="0.5" stop-color="#d946ef" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <filter id="tl-blur-wide" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
    <filter id="tl-blur-soft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" />
    </filter>
    <filter id="tl-blur-core" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <pattern id="tl-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" />
    </pattern>
  </defs>

  <!-- Ambient background dot texture -->
  <rect x="0" y="0" width="300" height="400" fill="url(#tl-dots)" opacity="0.06" />

  <!-- Ambient glow blobs for depth -->
  <circle cx="60" cy="378" r="70" fill="url(#tl-radial-purple)" opacity="0.3" filter="url(#tl-blur-wide)" />
  <circle cx="240" cy="42" r="80" fill="url(#tl-radial-fuchsia)" opacity="0.25" filter="url(#tl-blur-wide)" />

  <!-- Glow trail behind the main path -->
  <path
    d="M60,360 L60,60 L240,60"
    stroke="url(#tl-grad)"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.28"
    filter="url(#tl-blur-soft)"
  />

  <!-- Crisp straight path: bottom-left -> top-left -> top-right -->
  <path
    d="M60,360 L60,60 L240,60"
    stroke="url(#tl-grad)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Corner node: origin (bottom-left) -->
  <g>
    <circle cx="60" cy="360" r="14" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="60" cy="360" r="5" fill="#a855f7" />
  </g>

  <!-- Corner node: turning point (top-left) -->
  <g>
    <circle cx="60" cy="60" r="16" stroke="#d8b4fe" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="60" cy="60" r="5.5" fill="#c084fc" />
  </g>

  <!-- Corner node: current state (top-right), with a small connected
       network suggesting systems complexity -->
  <g>
    <circle cx="240" cy="60" r="20" stroke="#f0abfc" stroke-opacity="0.35" stroke-width="1" />
    <line x1="240" y1="60" x2="214" y2="48" stroke="#f0abfc" stroke-opacity="0.5" stroke-width="1" />
    <line x1="240" y1="60" x2="262" y2="44" stroke="#f0abfc" stroke-opacity="0.5" stroke-width="1" />
    <line x1="240" y1="60" x2="242" y2="30" stroke="#f0abfc" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="214" cy="48" r="2.5" fill="#f0abfc" opacity="0.8" />
    <circle cx="262" cy="44" r="2.5" fill="#f0abfc" opacity="0.8" />
    <circle cx="242" cy="30" r="2.5" fill="#f0abfc" opacity="0.8" />
    <circle cx="240" cy="60" r="7" fill="#e879f9" />
  </g>

  <!-- ── Centerpiece: a radial hub sitting in the open space the path
       frames, as the illustration's focal point ── -->
  <g transform="translate(155,220)">
    <!-- glow behind the core -->
    <circle r="30" fill="url(#tl-radial-core)" opacity="0.5" filter="url(#tl-blur-core)" />

    <!-- radiating spokes -->
    <g stroke="#e9d5ff" stroke-opacity="0.4" stroke-width="0.75">
      <line x1="0" y1="-26" x2="0" y2="-46" />
      <line x1="0" y1="26" x2="0" y2="46" />
      <line x1="-26" y1="0" x2="-46" y2="0" />
      <line x1="26" y1="0" x2="46" y2="0" />
      <line x1="-18" y1="-18" x2="-32" y2="-32" />
      <line x1="18" y1="-18" x2="32" y2="-32" />
      <line x1="-18" y1="18" x2="-32" y2="32" />
      <line x1="18" y1="18" x2="32" y2="32" />
    </g>

    <!-- concentric rings -->
    <circle r="46" stroke="#e9d5ff" stroke-opacity="0.15" stroke-width="1" />
    <circle r="32" stroke="#e9d5ff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 4" />
    <circle r="18" stroke="#f5d0fe" stroke-opacity="0.4" stroke-width="1" />

    <!-- small satellites orbiting the hub -->
    <circle cx="32" cy="-8" r="2" fill="#f5d0fe" opacity="0.85" />
    <circle cx="-28" cy="16" r="1.6" fill="#e9d5ff" opacity="0.7" />
    <circle cx="10" cy="-31" r="1.6" fill="#e9d5ff" opacity="0.7" />

    <!-- bright core -->
    <circle r="7" fill="url(#tl-radial-core)" />
    <circle r="3" fill="#fdf4ff" />
  </g>
</svg>
